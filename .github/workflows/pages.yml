name: pages

# Publishes the offline config-QR generator (tools/qr-config.html) to GitHub Pages
# as the site index, so it can be opened from a URL as well as the release asset.

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/qr-config.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site (qr-config.html as index)
        run: |
          mkdir -p _site
          cp tools/qr-config.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
