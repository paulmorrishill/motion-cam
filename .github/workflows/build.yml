name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-and-build:
    name: Unit tests + build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug + release APK
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/motion-cam-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/motion-cam-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          # Single line on purpose: the emulator-runner executes each script LINE
          # as a separate shell, which would drop $rc and mask test failures.
          script: 'set +e; ./gradlew connectedDebugAndroidTest --console=plain; rc=$?; mkdir -p screenshots; for f in 1_main_screen 2_uploads_screen 3_settings_screen; do adb exec-out run-as com.motioncam cat files/$f.png > "screenshots/$f.png" 2>/dev/null || true; done; ls -la screenshots || true; exit $rc'

      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: screenshots/**/*.png
          if-no-files-found: ignore

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected

  release:
    name: Publish APK release
    needs: [ unit-and-build, instrumented ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist

      - name: Publish / update "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MotionCam latest build
          body: |
            Automated build of MotionCam.
            Install **motion-cam-release.apk** on the phone (allow install from unknown sources).
            Built from commit ${{ github.sha }}.
          files: dist/*.apk
          make_latest: true
